<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move My Ass v1</title>
<link rel="icon" href="/static/logo.png?v=glitch3">
<link rel="stylesheet" href="/static/style.css?v=liveui58">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="logo" src="/static/logo.png?v=glitch3" width="168" height="56" alt="Move My Ass">
  </div>
  <div class="drop conn-drop" id="conn-drop">
    <button type="button" class="conn" id="conn" aria-haspopup="listbox" aria-expanded="false" title="Switch between mock folder and real Move">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">checking…</span>
    </button>
  </div>
  <div class="storage" id="storage" hidden>
    <div class="storage-bar" id="storage-bar" role="img" aria-label="Device storage"></div>
    <div class="storage-row">
      <span class="storage-used" id="storage-used">Measuring storage…</span>
      <span class="storage-legend" id="storage-legend"></span>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btn-refresh-library" class="ghost" title="Make Move rescan its library so new files appear on the device">Refresh device library</button>
    <button id="btn-settings" class="ghost">Connection</button>
  </div>
</header>

<dialog id="settings">
  <form method="dialog" id="settings-form" class="studio-form">
    <div class="studio-top">
      <div class="studio-title">
        <span class="kicker">Device</span>
        <h2>Connection</h2>
      </div>
    </div>
    <label>Mode
      <select name="backend" id="f-backend">
        <option value="mock">Mock folder (no device needed)</option>
        <option value="sftp">Real Move over SFTP</option>
      </select>
    </label>
    <label>Host <input name="host" id="f-host" placeholder="move.local"></label>
    <label>User <input name="user" id="f-user" placeholder="ableton"></label>
    <label>SSH key <input name="key_path" id="f-key" placeholder="~/.ssh/id_ed25519 (blank = agent / defaults)"></label>
    <div class="studio-foot">
      <p class="hint" id="settings-hint"></p>
      <menu>
        <button value="cancel" class="dismiss">Cancel</button>
        <button value="connect" id="btn-connect" class="primary">Connect</button>
      </menu>
    </div>
  </form>
</dialog>

<dialog id="ask">
  <form method="dialog" id="ask-form" class="studio-form">
    <div class="studio-top">
      <div class="studio-title">
        <span class="kicker">Library</span>
        <h2 id="ask-title">New folder</h2>
      </div>
    </div>
    <label><span id="ask-label">Name</span>
      <input id="ask-input" autocomplete="off" spellcheck="false">
    </label>
    <div class="studio-foot">
      <p class="hint" id="ask-hint"></p>
      <menu>
        <button type="button" id="ask-cancel" class="dismiss">Cancel</button>
        <button value="ok" id="ask-ok" class="primary">OK</button>
      </menu>
    </div>
  </form>
</dialog>

<dialog id="color-picker">
  <div class="studio-top">
    <div class="studio-title">
      <span class="kicker">Sets</span>
      <h2 id="color-title">Pad color</h2>
    </div>
  </div>
  <div class="color-grid" id="color-grid"></div>
  <div class="studio-foot">
    <p class="hint">This is the LED colour on the 32-pad grid.</p>
    <menu>
      <button type="button" id="color-cancel" class="dismiss">Cancel</button>
    </menu>
  </div>
</dialog>

<nav class="tabs" aria-label="Library">
  {% for section in sections %}
  <button type="button" class="tab{% if section == 'factory' %} factory{% endif %}" data-kind="{{ section }}">{{ section_labels.get(section, section) }}</button>
  {% endfor %}
</nav>

<main>
  <div class="toolbar">
    <div class="toolbar-select">
      <button id="btn-download" disabled>Download</button>
      <button id="btn-copy" hidden disabled>Copy to Samples</button>
      <button id="btn-rename" disabled>Rename</button>
      <button id="btn-color" hidden disabled>Color</button>
      <button id="btn-delete" class="danger" disabled>Delete</button>
      <span class="selcount" id="selcount"></span>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="spacer"></div>
    <button id="btn-upload" class="primary">Upload files</button>
    <button id="btn-upload-folder" class="ghost" title="Fill empty pads; extras go off the 32-pad grid">Upload folder</button>
    <button id="btn-mkdir" class="ghost">New folder</button>
    <div class="toolbar-kit" id="toolbar-kit">
      <button id="btn-kit">Build kit from folder</button>
      <button id="btn-slice" disabled>Slice into kit</button>
    </div>
    <div class="toolbar-fx" id="toolbar-preset" hidden>
      <button id="btn-preset" class="make">Make preset</button>
      <button id="btn-preset-edit" disabled>Edit preset</button>
    </div>
  </div>

  <input type="file" id="file-input" multiple hidden>
  <input type="file" id="folder-input" webkitdirectory multiple hidden>
  <input type="file" id="set-file-input" accept=".ablbundle,.zip,.abl,application/zip" multiple hidden>

  <div id="drop" class="dropzone">
    <table class="listing">
      <thead>
        <tr>
          <th class="c-check"><input type="checkbox" id="check-all"></th>
          <th class="c-name">Name</th>
          <th class="c-size">Size</th>
          <th class="c-date">Modified</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="setgrid" class="set-grid" hidden></div>
    <div id="set-loose" class="set-loose" hidden></div>
    <div id="empty" class="empty" hidden></div>
    <div class="drop-overlay"><span>Drop to upload here</span></div>
  </div>
</main>

<dialog id="kit" aria-label="Kit">
  <div class="studio-top">
    <div class="kit-meta">
      <label>Kit name <input id="kit-name" placeholder="My Kit"></label>
      <div class="kit-field">
        <span class="kit-field-label" id="kit-type-label">Type</span>
        <div class="kit-type" role="radiogroup" aria-labelledby="kit-type-label">
          <button type="button" class="kit-type-btn on" data-type="drum" aria-pressed="true" title="One shot, pads ring out">Drum</button>
          <button type="button" class="kit-type-btn" data-type="choke" aria-pressed="false" title="Pads cut each other off">Choke</button>
          <button type="button" class="kit-type-btn" data-type="gate" aria-pressed="false" title="Sustains while held">Gate</button>
        </div>
      </div>
      <label class="kit-fx">Return FX
        <span class="kit-fx-pair">
          <select id="kit-return-fx" aria-label="Return FX type">
            <option value="">Off</option>
            <option value="reverb" selected>Reverb</option>
          </select>
          <select id="kit-return-fx-preset" aria-label="Return FX preset">
            <option value="reverb">Default</option>
          </select>
        </span>
      </label>
      <label class="kit-fx">Insert FX
        <span class="kit-fx-pair">
          <select id="kit-insert-fx" aria-label="Insert FX type">
            <option value="">Off</option>
            <option value="saturator" selected>Saturator</option>
          </select>
          <select id="kit-insert-fx-preset" aria-label="Insert FX preset">
            <option value="saturator">Default</option>
          </select>
        </span>
      </label>
    </div>
  </div>

  <div id="kit-slice-controls" hidden>
    <div class="kit-slice-bar">
      <label>Slices <span id="slice-count-label">16</span>
        <input type="range" id="kit-slices" min="2" max="16" value="16">
      </label>
      <span class="hint" id="kit-slice-info"></span>
    </div>
  </div>
  <div class="kit-overview" id="kit-overview" hidden>
    <div class="kit-zoom" role="group" aria-label="Wave zoom">
      <button type="button" id="kit-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" id="kit-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" id="kit-zoom-fit" title="Fit whole sample" aria-label="Fit">Fit</button>
    </div>
    <canvas></canvas>
    <div class="kit-overview-nav" id="kit-overview-nav" hidden>
      <div class="kit-overview-thumb" id="kit-overview-thumb"></div>
    </div>
  </div>

  <div class="padgrid" id="padgrid" tabindex="-1"></div>
  <div class="studio-foot">
    <p class="hint" id="kit-hint"></p>
    <menu>
      <button id="kit-cancel" class="dismiss">Cancel</button>
      <button id="kit-download" class="ghost">Download bundle</button>
      <button id="kit-save" class="primary">Save to Move</button>
    </menu>
  </div>
</dialog>

<dialog id="preset">
  <div class="studio-top">
    <div class="studio-title">
      <span class="kicker">Track preset</span>
      <h2 id="preset-title">Make preset</h2>
    </div>
    <label class="preset-name-field">Preset name
      <input id="preset-name" placeholder="My Preset" autocomplete="off" spellcheck="false">
    </label>
  </div>
  <div class="preset-slots">
    <section class="preset-card instrument">
      <header>
        <span class="kicker">Sound</span>
        <h3>Instrument</h3>
      </header>
      <label>Type
        <select id="preset-instrument-kind">
          <option value="">Pick a type…</option>
        </select>
      </label>
      <label>Preset
        <select id="preset-instrument" disabled>
          <option value="">Pick a preset…</option>
        </select>
      </label>
      <label id="preset-sample-field" hidden>Sample
        <select id="preset-sample">
          <option value="">Pick a sample…</option>
        </select>
      </label>
    </section>
    <section class="preset-card effect">
      <header>
        <span class="kicker">Slot 1</span>
        <h3>Effect</h3>
      </header>
      <label>Type
        <select id="preset-slot1-kind">
          <option value="">Off</option>
        </select>
      </label>
      <label>Preset
        <select id="preset-slot1" disabled>
          <option value="">Off</option>
        </select>
      </label>
    </section>
    <section class="preset-card effect">
      <header>
        <span class="kicker">Slot 2</span>
        <h3>Effect</h3>
      </header>
      <label>Type
        <select id="preset-slot2-kind">
          <option value="">Off</option>
        </select>
      </label>
      <label>Preset
        <select id="preset-slot2" disabled>
          <option value="">Off</option>
        </select>
      </label>
    </section>
  </div>
  <div class="studio-foot">
    <p class="hint" id="preset-hint"></p>
    <menu>
      <button type="button" id="preset-cancel" class="dismiss">Cancel</button>
      <button type="button" id="preset-instrument-upload" class="ghost">Upload instrument</button>
      <button type="button" id="preset-effects-upload" class="ghost">Upload effects</button>
      <button type="button" id="preset-download" class="ghost">Download</button>
      <button type="button" id="preset-save" class="primary">Save to Move</button>
    </menu>
  </div>
  <input id="preset-instrument-file" type="file" accept=".ablpreset,.json,application/json" hidden>
  <input id="preset-effects-file" type="file" accept=".ablpreset,.json,application/json" hidden>
</dialog>

<footer class="statusbar">
  <span id="status">Ready</span>
  <span class="spacer"></span>
  <span id="pathinfo"></span>
</footer>

<div id="toasts"></div>
<script src="/static/app.js?v=liveui56"></script>
</body>
</html>
